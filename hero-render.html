<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hero card render</title>
<style>
  html, body { margin: 0; padding: 0; background: #070b16; }
  .hero { position: relative; overflow: hidden; width: 1200px; height: 630px; }
  #sky { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
</style>
</head>
<body>
<section class="hero"><canvas id="sky" aria-hidden="true"></canvas></section>
<script>

(function () {
  var canvas = document.getElementById('sky');
  if (!canvas || !canvas.getContext) return;
  var ctx = canvas.getContext('2d');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.documentElement.classList.add('sky-on');
  var hero = canvas.parentElement;

  var DPR = Math.min(window.devicePixelRatio || 1, window.innerWidth < 760 ? 1.3 : 1.75);
  var W = 0, H = 0;
  var stars = [], sparkles = [], blobs = [], bursts = [], meteor = null;
  var nextMeteorAt = 5000 + Math.random() * 7000;
  var running = true, inView = true, raf = null, lastT = 0;
  var animT = 0, heroOffTop = 0, heroOffLeft = 0;

  // Pre-rendered glow sprites: drawImage of a sprite is cheap; per-frame
  // radial gradients and shadowBlur are not. That discipline is the point.
  function glowSprite(r, g, b) {
    var c = document.createElement('canvas');
    c.width = c.height = 128;
    var x = c.getContext('2d');
    var grad = x.createRadialGradient(64, 64, 0, 64, 64, 64);
    grad.addColorStop(0, 'rgba(' + r + ',' + g + ',' + b + ',1)');
    grad.addColorStop(0.35, 'rgba(' + r + ',' + g + ',' + b + ',0.32)');
    grad.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ',0)');
    x.fillStyle = grad;
    x.fillRect(0, 0, 128, 128);
    return c;
  }
  var SPR = {
    white: glowSprite(235, 244, 255),
    teal: glowSprite(94, 234, 212),
    violet: glowSprite(150, 132, 235),
    plum: glowSprite(196, 110, 158),
    gold: glowSprite(217, 179, 106)
  };
  var TINTS = [SPR.white, SPR.white, SPR.white, SPR.teal, SPR.gold];

  var pointer = { cx: 0, cy: 0, x: 0, y: 0, sx: 0, sy: 0, inf: 0, active: false, touch: false };

  // The nebula is rendered to a small offscreen canvas and scaled up: the
  // gradients are soft, so the upscale is invisible, and the expensive
  // 'screen' blend happens at 1/36th of the pixels. Refreshed every 4th
  // frame, which the slow drift makes imperceptible.
  var neb = document.createElement('canvas');
  var nctx = neb.getContext('2d');
  var frameNo = 0;
  function renderNebula(t) {
    var nw = neb.width, nh = neb.height;
    nctx.clearRect(0, 0, nw, nh);
    nctx.globalCompositeOperation = 'screen';
    blobs.forEach(function (b) {
      var bx = (b.fx + Math.sin(t * b.p1 + b.ph) * 0.05) * nw;
      var by = (b.fy + Math.cos(t * b.p2 + b.ph * 1.7) * 0.06) * nh;
      var br = b.r * Math.max(nw, nh);
      nctx.globalAlpha = b.a * (0.85 + 0.15 * Math.sin(t * 0.0002 + b.ph));
      nctx.drawImage(b.spr, bx - br, by - br, br * 2, br * 2);
    });
    nctx.globalCompositeOperation = 'source-over';
    nctx.globalAlpha = 1;
  }

  function build() {
    var rect = hero.getBoundingClientRect();
    heroOffTop = rect.top + window.scrollY;
    heroOffLeft = rect.left + window.scrollX;
    W = Math.max(320, rect.width);
    H = Math.max(240, rect.height);
    pointer.x = pointer.sx = W / 2;
    pointer.y = pointer.sy = H / 2;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    neb.width = Math.max(80, Math.round(W / 6));
    neb.height = Math.max(60, Math.round(H / 6));

    blobs = [
      { fx: 0.16, fy: 0.30, r: 0.62, spr: SPR.teal,   a: 0.16, p1: 0.00011, p2: 0.00007, ph: 0.5 },
      { fx: 0.82, fy: 0.16, r: 0.55, spr: SPR.violet, a: 0.15, p1: 0.00009, p2: 0.00013, ph: 2.4 },
      { fx: 0.68, fy: 0.85, r: 0.58, spr: SPR.plum,   a: 0.12, p1: 0.00007, p2: 0.00010, ph: 4.2 },
      { fx: 0.42, fy: 0.55, r: 0.45, spr: SPR.teal,   a: 0.08, p1: 0.00013, p2: 0.00005, ph: 5.3 }
    ];

    var count = Math.min(W < 760 ? 150 : 190, Math.floor(W * H / (W < 760 ? 6400 : 5200)));
    stars = [];
    for (var i = 0; i < count; i++) {
      var layer = i % 3; // 0 far, 1 mid, 2 near
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        layer: layer,
        r: 0.5 + layer * 0.45 + Math.random() * 0.7,
        base: 0.5 + Math.random() * 0.48,
        tw: Math.random() * Math.PI * 2,
        tws: 0.4 + Math.random() * 1.1,
        spr: TINTS[Math.floor(Math.random() * TINTS.length)],
        drift: 1.5 + layer * 2.2
      });
    }
    sparkles = [];
    for (var j = 0; j < 9; j++) {
      sparkles.push({
        x: Math.random() * W, y: Math.random() * H,
        s: 5 + Math.random() * 8, ph: Math.random() * Math.PI * 2,
        ps: 0.25 + Math.random() * 0.45,
        spr: Math.random() < 0.3 ? SPR.gold : SPR.white
      });
    }
  }

  // Resize path (fix 1): iOS fires resize when its URL bar collapses
  // mid-scroll, and the hero's size does not change then -- rebuilding on
  // those events re-rolled the whole starfield (the teleport) and blanked
  // the canvas (the flash). Only a genuine size change touches anything
  // now, and a genuine change scales the existing field to the new box
  // instead of re-rolling it: same stars, same layout, no flash.
  function resizeSky() {
    var rect = hero.getBoundingClientRect();
    heroOffTop = rect.top + window.scrollY;
    heroOffLeft = rect.left + window.scrollX;
    var nW = Math.max(320, rect.width), nH = Math.max(240, rect.height);
    if (nW === W && nH === H) return;
    var sx = nW / W, sy = nH / H;
    stars.forEach(function (st) { st.x *= sx; st.y *= sy; });
    sparkles.forEach(function (sp) { sp.x *= sx; sp.y *= sy; });
    bursts.forEach(function (p) { p.x *= sx; p.y *= sy; });
    if (meteor) { meteor.x *= sx; meteor.y *= sy; }
    pointer.sx *= sx; pointer.sy *= sy;
    W = nW; H = nH;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    neb.width = Math.max(80, Math.round(W / 6));
    neb.height = Math.max(60, Math.round(H / 6));
  }

  // One owner for the loop's start/stop (fix 3): both controllers
  // (visibility, intersection) go through here, and a restart re-bases
  // lastT so the first resumed frame steps one frame's worth.
  function start() {
    if (raf || reduced || !running || !inView) return;
    lastT = performance.now();
    raf = requestAnimationFrame(frame);
  }
  function stop() {
    if (raf) { cancelAnimationFrame(raf); raf = null; }
  }

  function drawSparkle(x, y, s, alpha, spr) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.drawImage(spr, -s * 0.5, -s * 0.5, s, s);
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-s, 0); ctx.quadraticCurveTo(0, 0, 0, -s);
    ctx.quadraticCurveTo(0, 0, s, 0); ctx.quadraticCurveTo(0, 0, 0, s);
    ctx.quadraticCurveTo(0, 0, -s, 0);
    ctx.stroke();
    ctx.restore();
  }

  function frame(now) {
    var dt = Math.min(50, now - lastT || 16);
    lastT = now;
    // One clock (fix 2): the phases (twinkle, nebula, sparkles, meteor
    // timing) read the same accumulated time the drift integrates, so a
    // pause stops the whole sky together instead of letting the glow
    // state leap forward by the paused duration on resume. While the
    // loop runs, animT advances at wall-clock rate -- identical motion.
    animT += dt;
    var t = animT;
    ctx.clearRect(0, 0, W, H);

    // Pointer response: ease on a time constant, not per frame, so
    // 120Hz and 60Hz displays feel the same; and an influence value
    // fades the whole effect in and out, so entering or leaving the
    // hero never makes the field jump.
    pointer.x = pointer.cx - (heroOffLeft - window.scrollX);
    pointer.y = pointer.cy - (heroOffTop - window.scrollY);
    var kp = 1 - Math.exp(-dt / 80);
    pointer.sx += (pointer.x - pointer.sx) * kp;
    pointer.sy += (pointer.y - pointer.sy) * kp;
    var ki = 1 - Math.exp(-dt / 160);
    pointer.inf += ((pointer.active ? 1 : 0) - pointer.inf) * ki;
    if (!pointer.active && pointer.inf < 0.002) pointer.inf = 0;
    var px = (pointer.sx / Math.max(W, 1) - 0.5) * pointer.inf;
    var py = (pointer.sy / Math.max(H, 1) - 0.5) * pointer.inf;

    // Flowing nebula, pre-composited at low res (see renderNebula).
    frameNo++;
    if (frameNo % 4 === 1) renderNebula(t);
    ctx.drawImage(neb, 0, 0, W, H);

    // Pointer bloom: a soft light where the visitor is (mouse/pen only).
    if (pointer.inf > 0.01 && !pointer.touch) {
      ctx.globalCompositeOperation = 'screen';
      ctx.globalAlpha = 0.12 * pointer.inf;
      ctx.drawImage(SPR.teal, pointer.sx - 190, pointer.sy - 190, 380, 380);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }

    // Stars: layered parallax, slow current, twinkle, pointer brightening.
    stars.forEach(function (st) {
      st.x -= st.drift * dt / 1000;
      if (st.x < -4) { st.x = W + 4; st.y = Math.random() * H; }
      var ox = -px * (st.layer + 1) * 5, oy = -py * (st.layer + 1) * 3.5;
      var x = st.x + ox, y = st.y + oy;
      var tw = 0.72 + 0.28 * Math.sin(t * 0.001 * st.tws + st.tw);
      var boost = 0;
      if (pointer.inf > 0.01) {
        var dx = x - pointer.sx, dy = y - pointer.sy;
        var d2 = dx * dx + dy * dy;
        if (d2 < 16900) boost = (1 - d2 / 16900) * 0.6 * pointer.inf;
      }
      var a = Math.min(1, st.base * tw + boost);
      var r = st.r * (1 + boost * 0.9);
      ctx.globalAlpha = a;
      // Far stars skip the glow sprite: a third of the drawImage calls
      // gone, which is where the frame stutter was coming from.
      if (st.layer > 0) {
        var gs = r * 7;
        ctx.drawImage(st.spr, x - gs / 2, y - gs / 2, gs, gs);
      }
      ctx.fillStyle = 'rgba(255,255,255,' + Math.min(1, a + 0.3) + ')';
      ctx.beginPath();
      ctx.arc(x, y, Math.max(0.45, r * 0.55), 0, 6.2832);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    // Sparkles pulse in and out of existence.
    sparkles.forEach(function (sp) {
      var pulse = Math.max(0, Math.sin(t * 0.001 * sp.ps + sp.ph));
      if (pulse > 0.55) {
        drawSparkle(sp.x - px * 10, sp.y - py * 7, sp.s * pulse, (pulse - 0.55) * 1.6, sp.spr);
      }
    });

    // Tap/click bursts: a small spray of star-dust that falls and fades.
    bursts = bursts.filter(function (p) { return p.life > 0; });
    bursts.forEach(function (p) {
      p.life -= dt / 750;
      p.x += p.vx * dt / 1000;
      p.y += p.vy * dt / 1000;
      p.vy += 26 * dt / 1000;
      var s = 16 * Math.max(0, p.life);
      ctx.globalAlpha = Math.max(0, p.life) * 0.9;
      ctx.drawImage(p.spr, p.x - s / 2, p.y - s / 2, s, s);
    });
    ctx.globalAlpha = 1;

    // Occasional shooting star.
    if (!meteor && t > nextMeteorAt) {
      meteor = {
        x: W * (0.25 + Math.random() * 0.6), y: H * Math.random() * 0.3,
        vx: -(340 + Math.random() * 220), vy: 190 + Math.random() * 110, life: 1
      };
    }
    if (meteor) {
      meteor.x += meteor.vx * dt / 1000;
      meteor.y += meteor.vy * dt / 1000;
      meteor.life -= dt / 1300;
      var m = meteor, tl = 92;
      var grad = ctx.createLinearGradient(m.x, m.y, m.x - m.vx / Math.abs(m.vx) * tl, m.y - m.vy / Math.abs(m.vx) * tl);
      grad.addColorStop(0, 'rgba(255,255,255,' + (0.9 * Math.max(0, m.life)) + ')');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(m.x, m.y);
      ctx.lineTo(m.x - m.vx / Math.abs(m.vx) * tl, m.y - m.vy / Math.abs(m.vx) * tl);
      ctx.stroke();
      ctx.globalAlpha = Math.max(0, m.life);
      ctx.drawImage(SPR.white, m.x - 13, m.y - 13, 26, 26);
      ctx.globalAlpha = 1;
      if (m.life <= 0 || m.x < -120 || m.y > H + 60) {
        meteor = null;
        nextMeteorAt = t + 6000 + Math.random() * 9000;
      }
    }

    if (running && inView && !reduced) { raf = requestAnimationFrame(frame); } else { raf = null; }
  }

  function drawStatic() {
    // One composed still frame for reduced-motion visitors.
    build();
    lastT = 0;
    animT = 1150;
    var keepRunning = running;
    running = false;
    frame(1200);
    running = keepRunning;
  }

  function burstAt(x, y) {
    if (reduced) return;
    for (var i = 0; i < 14; i++) {
      var ang = Math.random() * Math.PI * 2, sp = 26 + Math.random() * 90;
      bursts.push({
        x: x, y: y,
        vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 22,
        life: 0.7 + Math.random() * 0.5,
        spr: [SPR.white, SPR.teal, SPR.gold][Math.floor(Math.random() * 3)]
      });
    }
  }

  hero.addEventListener('pointermove', function (e) {
    pointer.touch = e.pointerType === 'touch';
    pointer.cx = e.clientX; pointer.cy = e.clientY;
    if (!pointer.active) {
      // Entering: seed the light at the cursor while its influence is
      // still 0, then let the fade bring it in. No visible jump.
      pointer.sx = pointer.x = e.clientX - (heroOffLeft - window.scrollX);
      pointer.sy = pointer.y = e.clientY - (heroOffTop - window.scrollY);
    }
    pointer.active = true;
  });
  hero.addEventListener('pointerleave', function () { pointer.active = false; });
  hero.addEventListener('pointerdown', function (e) {
    pointer.touch = e.pointerType === 'touch';
    pointer.cx = e.clientX; pointer.cy = e.clientY;
    pointer.active = true;
    burstAt(e.clientX - (heroOffLeft - window.scrollX), e.clientY - (heroOffTop - window.scrollY));
  });

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { if (reduced) drawStatic(); else resizeSky(); }, 180);
  });
  document.addEventListener('visibilitychange', function () {
    running = !document.hidden;
    if (running) start(); else stop();
  });
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (entries) {
      inView = entries[0].isIntersecting;
      if (inView) start(); else stop();
    }, { rootMargin: '120px 0px 120px 0px', threshold: 0 }).observe(hero);
  }

  build();
  if (reduced) {
    drawStatic();
  } else {
    start();
  }
})();

</script>
<script>
  setTimeout(function () { document.title = 'RENDER READY'; }, 6500);
</script>
</body>
</html>
