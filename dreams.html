<script>
(function () {
  var bands = Array.prototype.slice.call(document.querySelectorAll('.latent-band'));
  if (!bands.length) return;
  document.documentElement.classList.add('latent-live');
  // The opened band starts below the top bar; CSS needs the bar's real
  // height so the image is sized to the space under it, fully in view.
  // One world can be open at a time across all bands: opening a world
  // in another pair closes the current one first.
  var header = document.querySelector('.site-header');
  var openBand = null, openIdx = -1;
  function setBar() {
    if (!header) return;
    var h = header.offsetHeight;
    document.documentElement.style.setProperty('--bar-h', h + 'px');
    document.documentElement.style.setProperty('--bar-half', (h / 2) + 'px');
  }
  window.addEventListener('resize', function () { if (openBand) setBar(); });
  function closeOpen() {
    if (!openBand) return;
    var b = openBand;
    openBand = null; openIdx = -1;
    b.classList.remove('open');
    Array.prototype.forEach.call(b.querySelectorAll('.slice'), function (s) {
      s.classList.remove('active'); s.setAttribute('aria-expanded', 'false');
    });
    document.documentElement.removeAttribute('data-world');
    document.documentElement.classList.remove('world-lock');
    document.documentElement.style.removeProperty('--bar-h');
    document.documentElement.style.removeProperty('--bar-half');
  }
  function toggle(band, slices, idx) {
    if (openBand === band && openIdx === idx) { closeOpen(); return; }
    closeOpen();
    setBar();
    openBand = band; openIdx = idx;
    band.classList.add('open');
    slices.forEach(function (s, i) {
      s.classList.toggle('active', i === idx);
      s.setAttribute('aria-expanded', i === idx ? 'true' : 'false');
    });
    document.documentElement.setAttribute('data-world', slices[idx].getAttribute('data-world'));
    document.documentElement.classList.add('world-lock');
  }
  bands.forEach(function (band) {
    var slices = Array.prototype.slice.call(band.querySelectorAll('.slice'));
    slices.forEach(function (s, i) { s.addEventListener('click', function () { toggle(band, slices, i); }); });
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && openBand) closeOpen(); });
})();
</script>
<script>
function initDreamGL(band, canvas) {
  // Dreamscape liquid-dimensional seam v3: vanilla WebGL1 shader
  // displacement over the two artworks (research report:
  // research_notes/dreamscape-liquid-dimensional-ripple). DOM slices
  // stay the tap layer and the fallback; any failure leaves the page
  // unchanged.
  //
  // v3.1: the exit stutter. On close the band teleports from its
  // fixed full-screen spot back to its in-flow position lower on
  // the page -- a one-frame drop the expansion can't mask on the
  // way out. FLIP it: at the close mutation, counter-shift the
  // band by the measured drop (transform only) and ease the shift
  // to zero on the same clock, so the world glides down into
  // place. And while an ease is in flight, resize retargets are
  // queued instead of shifting the targets mid-motion (iOS URL
  // bar breathing was doing exactly that).
  //
  // v4 (multi-band): the v3.1 engine, instantiated once per band so
  // each pair of worlds gets its own seam, textures and render loop.
  // Bands pause when off-screen (IntersectionObserver gate inside),
  // so a second band costs nothing while it is out of view. The old
  // page-global gl-on class is gone; the transition freeze is now
  // scoped to each band's own gl-live class in CSS.
  //
  // v3 mapping model -- per-world STAGES. v1/v2 cover-fit each
  // texture to the whole band and cut it at the seam, which framed
  // the closed split badly (subjects clipped by the frame edges)
  // and, because the band's height snaps on open (CSS cannot
  // animate to auto), re-cropped the image in one step mid-gesture
  // -- the visible "squash". Now each texture is cover-fit to its
  // own stage: its half of the band when closed (the framing the
  // DOM version had), growing continuously to the full band as the
  // split opens. Split and band aspect are both eased in JS on one
  // exponential clock (tau ~190ms, the research's interaction spec),
  // so framing and seam move as a single smooth motion.
  if (!band || !canvas) return;
  var slices = band.querySelectorAll('.slice');
  if (slices.length !== 2) return;

  var gl;
  try {
    gl = canvas.getContext('webgl', { alpha: false, depth: false, stencil: false, antialias: false, powerPreference: 'low-power' });
  } catch (e) { gl = null; }
  if (!gl) return;

  var VERT = 'attribute vec2 aPos;varying vec2 vUv;void main(){vUv=aPos*0.5+0.5;gl_Position=vec4(aPos,0.0,1.0);}';
  var FRAG = [
    'precision mediump float;',
    'varying vec2 vUv;',
    'uniform sampler2D uTexA;',
    'uniform sampler2D uTexB;',
    'uniform float uTime;',
    'uniform float uSplit;',
    'uniform float uHoriz;',
    'uniform float uBand;',
    'uniform float uTA;',
    'uniform float uTB;',
    'uniform float uWA;', // stage size of world A along the across axis (0.5..1)
    'uniform float uWB;',
    'uniform float uAspectA;', // stage aspect (u/v) per world
    'uniform float uAspectB;',
    'uniform vec4 uRectA;', // POT sub-rect: (scaleX, scaleY, offX, offY)
    'uniform vec4 uRectB;',
    'vec2 coverUv(vec2 local, float ta, float va){',
    '  vec2 f = vec2(0.5, 0.68);', // subject focal: 50% across, 32% from top
    '  float r = va / ta;',
    '  vec2 u = local;',
    '  if (r >= 1.0) { float vf = 1.0 / r; u = vec2(local.x, f.y * (1.0 - vf) + local.y * vf); }',
    '  else { u = vec2(f.x * (1.0 - r) + local.x * r, local.y); }',
    '  return f + (u - f) / 1.15;', // the 1.15 overscan = drift headroom
    '}',
    'float wave(float s, float t){',
    '  return 0.011 * sin(6.9 * s - t * 0.70)',
    '       + 0.006 * sin(13.7 * s + t * 0.42 + 1.7)',
    '       + 0.0025 * sin(27.0 * s - t * 0.24 + 4.1);',
    '}',
    'float slope(float s, float t){',
    '  return 0.011 * 6.9 * cos(6.9 * s - t * 0.70)',
    '       + 0.006 * 13.7 * cos(13.7 * s + t * 0.42 + 1.7)',
    '       + 0.0025 * 27.0 * cos(27.0 * s - t * 0.24 + 4.1);',
    '}',
    'void main(){',
    '  vec2 uv = vUv;',
    '  float s = mix(uv.y, uv.x, uHoriz);',
    // Across-axis: landscape = x from the left (world A). Portrait =
    // from the TOP (world A stacks first), but GL y runs bottom-up,
    // hence the flip.
    '  float n = mix(uv.x, 1.0 - uv.y, uHoriz);',
    '  float t = uTime;',
    // When a world is open the split parks at an edge; the seam must
    // calm to a straight off-screen line or a wavy sliver of the
    // other world shows along the edge.
    '  float edge = smoothstep(0.0, 0.07, uSplit) * smoothstep(1.0, 0.93, uSplit);',
    '  float w = wave(s, t) * edge;',
    '  float d = n - (uSplit + w);',
    '  float bandF = exp(-abs(d) / uBand) * edge;',
    '  float sl = slope(s, t);',
    '  float refr = sl * 0.012 * bandF;',
    '  vec2 refrVec = mix(vec2(refr, 0.0), vec2(0.0, refr), uHoriz);',
    '  float breathe = 1.0 + 0.2 * sin(t * 0.31 + 0.8);',
    '  vec2 driftA = vec2(sin(t * 0.33), sin(t * 0.23 + 1.3)) * 0.020;',
    '  vec2 driftB = vec2(sin(t * 0.19 + 2.1), sin(t * 0.27 + 0.4)) * 0.012;',
    // Stage-local coordinates: each world is framed inside its own
    // stage (its share of the band), not stretched across the band.
    '  float na = n / uWA;',
    '  float nb = (n - (1.0 - uWB)) / uWB;',
    '  vec2 localA = mix(vec2(na, uv.y), vec2(uv.x, 1.0 - na), uHoriz);',
    '  vec2 localB = mix(vec2(nb, uv.y), vec2(uv.x, 1.0 - nb), uHoriz);',
    '  vec2 uvA = coverUv(localA, uTA, uAspectA) + driftA + refrVec * breathe;',
    '  vec2 uvB = coverUv(localB, uTB, uAspectB) + driftB + refrVec * 1.6 * breathe;',
    '  uvA = uvA * uRectA.xy + uRectA.zw;',
    '  uvB = uvB * uRectB.xy + uRectB.zw;',
    '  vec3 colA = texture2D(uTexA, uvA).rgb;',
    '  vec3 colB = texture2D(uTexB, uvB).rgb;',
    '  float m = smoothstep(-0.0015, 0.0015, d);',
    '  vec3 col = mix(colA, colB, m);',
    '  col += clamp(sl, -1.0, 1.0) * bandF * 0.13;',
    '  col += exp(-abs(d) * 220.0) * 0.08 * edge;',
    '  col -= exp(-abs(d - 0.006) * 160.0) * 0.05 * edge;',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n');

  function shader(type, src) {
    var sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) return null;
    return sh;
  }
  var vs = shader(gl.VERTEX_SHADER, VERT), fs = shader(gl.FRAGMENT_SHADER, FRAG);
  if (!vs || !fs) return;
  var prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return;
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  var aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  var U = {};
  ['uTexA', 'uTexB', 'uTime', 'uSplit', 'uHoriz', 'uBand', 'uTA', 'uTB',
   'uWA', 'uWB', 'uAspectA', 'uAspectB', 'uRectA', 'uRectB'].forEach(function (name) {
    U[name] = gl.getUniformLocation(prog, name);
  });
  gl.uniform1i(U.uTexA, 0);
  gl.uniform1i(U.uTexB, 1);
  gl.uniform1f(U.uBand, 0.055);

  var anisoExt = gl.getExtension('EXT_texture_filter_anisotropic') ||
                 gl.getExtension('WEBKIT_EXT_texture_filter_anisotropic');
  var maxAniso = anisoExt ? gl.getParameter(anisoExt.MAX_TEXTURE_MAX_ANISOTROPY_EXT) : 1;

  function nextPow2(v) { var p = 1; while (p < v) p *= 2; return p; }
  var texA = null, texB = null, ready = false;
  function makeTex(unit, img) {
    // Re-pack onto a power-of-two canvas so WebGL1 allows mipmaps;
    // NPOT textures are stuck with plain LINEAR and look soft.
    var W = nextPow2(img.naturalWidth), H = nextPow2(img.naturalHeight);
    var cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    cv.getContext('2d').drawImage(img, 0, 0);
    var t = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, cv);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    if (anisoExt && maxAniso > 1) gl.texParameteri(gl.TEXTURE_2D, anisoExt.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(16, maxAniso));
    gl.generateMipmap(gl.TEXTURE_2D);
    var rect = [img.naturalWidth / W, img.naturalHeight / H, 0, 1 - img.naturalHeight / H];
    return { tex: t, aspect: img.naturalWidth / img.naturalHeight, rect: rect };
  }
  var loaded = 0;
  function onLoad(which, img) {
    return function () {
      try {
        if (which === 0) texA = makeTex(0, img); else texB = makeTex(1, img);
      } catch (e) { return; } // texture failure: fallback stays, no gl-live
      loaded++;
      if (loaded === 2) start();
    };
  }
  function loadTextures() {
    loaded = 0; texA = null; texB = null;
    var imgA = new Image(); imgA.onload = onLoad(0, imgA); imgA.src = slices[0].querySelector('img').src;
    var imgB = new Image(); imgB.onload = onLoad(1, imgB); imgB.src = slices[1].querySelector('img').src;
  }
  loadTextures();

  var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  // DPR floor is 1.5: the step-down exists for thermals, but letting
  // it reach 1.0 made the images visibly soft on hi-dpi phones.
  var dprSteps = [2, 1.75, 1.5], stepIdx = 0;
  var inView = true, running = false, raf = 0, lastTs = 0, tSec = 0;
  var lastTickAt = 0, lastRafAt = 0, intervalDriver = null;
  var bandW = 0, bandH = 0;
  var ftSum = 0, ftCount = 0;
  // One JS clock for the open/close motion: split and aspect ease
  // toward their targets together (exponential approach, tau 190ms).
  var splitCur = 0.5, splitTarget = 0.5;
  var aspectCur = 1, aspectTarget = 1;
  var TAU = 0.19;
  var bandOffset = 0;      // FLIP counter-shift for the close drop
  var fixedTop = 0;        // band's viewport top while open (recorded)
  var needsRetarget = false;

  function resize() {
    bandW = band.clientWidth; bandH = band.clientHeight;
    if (!bandW || !bandH) return;
    var dpr = Math.min(window.devicePixelRatio || 1, dprSteps[stepIdx]);
    var bw = Math.round(bandW * dpr), bh = Math.round(bandH * dpr);
    if (canvas.width !== bw || canvas.height !== bh) {
      canvas.width = bw; canvas.height = bh;
      gl.viewport(0, 0, bw, bh);
    }
  }
  function horizNow() { return bandW >= bandH ? 0 : 1; }

  function retarget() {
    // Called right after the band's class changes: its box has
    // already snapped to the settled geometry, so targets read true.
    resize();
    if (!bandW || !bandH) return;
    aspectTarget = bandW / bandH;
    if (band.classList.contains('open')) {
      var active = band.querySelector('.slice.active');
      splitTarget = (active === slices[1]) ? 0.0005 : 0.9995;
      fixedTop = band.getBoundingClientRect().top;
    } else {
      splitTarget = 0.5;
    }
  }
  function animating() {
    return Math.abs(splitTarget - splitCur) > 0.0008 ||
           Math.abs(aspectTarget - aspectCur) > 0.002 ||
           bandOffset !== 0;
  }
  var resizeTimer = 0;
  if (window.ResizeObserver) {
    new ResizeObserver(function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        if (animating()) { needsRetarget = true; return; }
        stepIdx = 0;
        resize(); retarget();
        if (!band.classList.contains('open')) { /* rotation while closed: snap */ splitCur = splitTarget; aspectCur = aspectTarget; }
        if (mq.matches) drawStatic();
      }, 120);
    }).observe(band);
  }
  window.addEventListener('resize', function () {
    if (animating()) { needsRetarget = true; return; }
    resize(); retarget(); if (mq.matches) drawStatic();
  });

  function layoutSplit() {
    // Reduced-motion / initial state only: read the live flex layout.
    if (!bandW || !bandH) return 0.5;
    if (bandW >= bandH) return Math.min(1, Math.max(0, (slices[0].offsetWidth - 8) / bandW));
    return Math.min(1, Math.max(0, (slices[0].offsetHeight - 8) / bandH));
  }

  function draw(time, split, aspect) {
    if (!texA || !texB) return;
    var horiz = horizNow();
    var wA = Math.max(0.5, split), wB = Math.max(0.5, 1 - split);
    var aspA, aspB;
    if (horiz === 0) { aspA = wA * aspect; aspB = wB * aspect; }
    else { aspA = aspect / wA; aspB = aspect / wB; }
    gl.uniform1f(U.uTime, time);
    gl.uniform1f(U.uSplit, split);
    gl.uniform1f(U.uHoriz, horiz);
    gl.uniform1f(U.uTA, texA.aspect);
    gl.uniform1f(U.uTB, texB.aspect);
    gl.uniform1f(U.uWA, wA);
    gl.uniform1f(U.uWB, wB);
    gl.uniform1f(U.uAspectA, aspA);
    gl.uniform1f(U.uAspectB, aspB);
    gl.uniform4f(U.uRectA, texA.rect[0], texA.rect[1], texA.rect[2], texA.rect[3]);
    gl.uniform4f(U.uRectB, texB.rect[0], texB.rect[1], texB.rect[2], texB.rect[3]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  function drawStatic() {
    if (!ready) return;
    resize();
    var lay = layoutSplit();
    draw(0, lay, bandW / bandH);
  }

  function tick(ts) {
    lastTickAt = performance.now();
    if (!lastTs) lastTs = ts;
    var dt = Math.min(0.05, Math.max(0, (ts - lastTs) / 1000));
    lastTs = ts;
    tSec += dt;
    var k = 1 - Math.exp(-dt / TAU);
    splitCur += (splitTarget - splitCur) * k;
    aspectCur += (aspectTarget - aspectCur) * k;
    if (bandOffset !== 0) {
      bandOffset += (0 - bandOffset) * k;
      if (Math.abs(bandOffset) < 0.15) {
        bandOffset = 0;
        band.style.transform = '';
        band.style.willChange = '';
      } else {
        band.style.transform = 'translateY(' + (-bandOffset).toFixed(1) + 'px)';
      }
    }
    draw(tSec, splitCur, aspectCur);
    if (!animating() && needsRetarget) {
      needsRetarget = false;
      stepIdx = 0;
      resize(); retarget();
    }
    // Adaptive quality: sustained slow frames step the DPR cap down.
    if (dt > 0) { ftSum += dt * 1000; ftCount++; }
    if (ftCount >= 90) {
      if (ftSum / ftCount > 26 && stepIdx < dprSteps.length - 1 && !animating()) { stepIdx++; resize(); }
      ftSum = 0; ftCount = 0;
    }
  }
  function rafFrame(ts) {
    if (!running) return;
    lastRafAt = performance.now();
    tick(ts);
    raf = requestAnimationFrame(rafFrame);
  }
  function startLoop() {
    if (running || mq.matches) return;
    running = true; lastTs = 0;
    raf = requestAnimationFrame(rafFrame);
  }
  function stopLoop() {
    running = false;
    if (raf) cancelAnimationFrame(raf);
    if (intervalDriver) { clearInterval(intervalDriver); intervalDriver = null; }
  }
  function shouldRun() {
    return ready && !mq.matches && inView && document.visibilityState === 'visible';
  }
  function gate() {
    if (!ready) return;
    if (mq.matches) { stopLoop(); drawStatic(); return; }
    if (shouldRun()) startLoop(); else stopLoop();
  }
  // Watchdog: if rAF stalls on a device while the band should be
  // animating, an interval takes over so taps still move the seam.
  setInterval(function () {
    if (!shouldRun() || !running) return;
    var now = performance.now();
    if (now - lastTickAt > 700 && !intervalDriver) {
      intervalDriver = setInterval(function () { tick(performance.now()); }, 50);
    }
    if (intervalDriver && now - lastRafAt <= 700) {
      clearInterval(intervalDriver); intervalDriver = null;
    }
  }, 400);

  if (window.IntersectionObserver) {
    new IntersectionObserver(function (entries) {
      inView = entries[0].isIntersecting;
      gate();
    }, { threshold: 0.02 }).observe(band);
  }
  document.addEventListener('visibilitychange', gate);
  if (mq.addEventListener) mq.addEventListener('change', gate);
  // State changes: resize the backing store NOW (no debounce -- a
  // stretched canvas during the gesture reads as distortion), set
  // the motion targets, and in reduced-motion follow the transition
  // with frozen-time redraws.
  var rmTimer = null;
  new MutationObserver(function () {
    var nowOpen = band.classList.contains('open');
    if (!nowOpen && fixedTop && !mq.matches && ready) {
      // The band just teleported back into flow: counter-shift it
      // so this frame renders exactly where the fixed band was,
      // then the tick eases the shift away.
      var drop = band.getBoundingClientRect().top - fixedTop;
      if (drop > 1) {
        bandOffset = drop;
        band.style.willChange = 'transform';
        band.style.transform = 'translateY(' + (-drop) + 'px)';
      }
    }
    if (nowOpen) {
      bandOffset = 0;
      band.style.transform = '';
      band.style.willChange = '';
    }
    retarget();
    if (!mq.matches || !ready) return;
    var until = performance.now() + 950;
    if (rmTimer) clearInterval(rmTimer);
    rmTimer = setInterval(function () {
      drawStatic();
      if (performance.now() > until) { clearInterval(rmTimer); rmTimer = null; }
    }, 40);
  }).observe(band, { attributes: true, attributeFilter: ['class'] });

  canvas.addEventListener('webglcontextlost', function (e) {
    e.preventDefault();
    stopLoop();
    ready = false;
    band.classList.remove('gl-live');
    canvas.style.opacity = '0';
  });
  canvas.addEventListener('webglcontextrestored', function () {
    loadTextures();
  });

  function start() {
    ready = true;
    resize();
    retarget();
    splitCur = splitTarget; aspectCur = aspectTarget;
    draw(0.001, splitCur, aspectCur);
    // First successful frame drawn: reveal the canvas over the DOM.
    band.style.transform = '';
    band.classList.add('gl-live');
    canvas.style.opacity = '1';
    gate();
  }
}
document.querySelectorAll('.latent-band').forEach(function (band) {
  initDreamGL(band, band.querySelector('canvas.dream-gl'));
});

</script>
<script>
(function () {
  var btn = document.querySelector('.nav-toggle');
  var nav = document.getElementById('site-nav');
  if (!btn || !nav) return;
  btn.addEventListener('click', function () {
    var open = nav.classList.toggle('open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
})();
</script>
