<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dreamscape — Adam Laloge</title>
<meta name="description" content="AI artwork directed by Adam Laloge. Images sit in two-image splits. Open one and it fills the screen while the page takes on its colors.">
<link rel="stylesheet" href="styles.css?v=53">
</head>
<body>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="index.html">Adam Laloge</a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-label="Menu">&#9776;</button>
    <nav id="site-nav">
      <a href="index.html">Home</a>
      <a href="work.html">Projects</a>
      <a href="resume.html">Resume</a>
      <a href="about.html">About</a>
      <a href="photography.html">Photography</a>

      <a href="dreams.html" class="active">Dreamscape</a>
      <a href="latent-sitemap.html">Atlas</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="world-ambient" aria-hidden="true"></div>
  <section class="latent-head">
    <p class="label">Dreamscape</p>
    <h2>Worlds imagined by computers</h2>
    <p class="section-note">I simply directed them.</p>
  </section>

  <div class="latent-band" id="latent-band">
    <canvas id="dream-gl" aria-hidden="true"></canvas>
    <button type="button" class="slice" data-world="golden" aria-expanded="false" aria-label="Open The Golden City">
      <img src="art/golden-city.jpg" alt="A golden city of spires and bridges in the clouds, built around a glowing ring" draggable="false">
      <span class="slice-title">The Golden City</span>
      <span class="slice-cap">
        <strong>The Golden City</strong>
        <span>A city in the clouds, built around a ring of light.</span>
        <span class="slice-hint">Tap again to come back</span>
      </span>
    </button>
    <button type="button" class="slice" data-world="ember" aria-expanded="false" aria-label="Open Obsidian Dragon">
      <span class="seam" aria-hidden="true"></span>
      <img src="art/obsidian-dragon.jpg" alt="An obsidian dragon with lava-lit cracks roaring over a burning volcanic valley at night" draggable="false">
      <span class="slice-title">Obsidian Dragon</span>
      <span class="slice-cap">
        <strong>Obsidian Dragon</strong>
        <span>Obsidian and lava over a burning valley. The render my avatar was cut from.</span>
        <span class="slice-hint">Tap again to come back</span>
      </span>
    </button>
  </div>

  <p class="flow-hint">Tap a world to step inside &middot; tap again to come back</p>

  <section>
    <p class="section-note">More worlds arrive as I make them.</p>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <span><strong>Adam Laloge</strong></span>
    <span class="footer-links"><a href="https://github.com/AStellarScene">GitHub</a> &middot; <a href="mailto:hello@adamlaloge.com">hello@adamlaloge.com</a></span>
  </div>
</footer>
<script>
(function () {
  var band = document.getElementById('latent-band');
  if (!band) return;
  var slices = Array.prototype.slice.call(band.querySelectorAll('.slice'));
  var openIdx = -1;
  document.documentElement.classList.add('latent-live');
  // The opened band starts below the top bar; CSS needs the bar's real
  // height so the image is sized to the space under it, fully in view.
  var header = document.querySelector('.site-header');
  function setBar() {
    if (!header) return;
    var h = header.offsetHeight;
    document.documentElement.style.setProperty('--bar-h', h + 'px');
    document.documentElement.style.setProperty('--bar-half', (h / 2) + 'px');
  }
  window.addEventListener('resize', function () { if (openIdx >= 0) setBar(); });
  function toggle(idx) {
    if (openIdx === idx) {
      openIdx = -1;
      band.classList.remove('open');
      slices.forEach(function (s) { s.classList.remove('active'); s.setAttribute('aria-expanded', 'false'); });
      document.documentElement.removeAttribute('data-world');
      document.documentElement.classList.remove('world-lock');
      document.documentElement.style.removeProperty('--bar-h');
      document.documentElement.style.removeProperty('--bar-half');
    } else {
      setBar();
      openIdx = idx;
      band.classList.add('open');
      slices.forEach(function (s, i) {
        s.classList.toggle('active', i === idx);
        s.setAttribute('aria-expanded', i === idx ? 'true' : 'false');
      });
      document.documentElement.setAttribute('data-world', slices[idx].getAttribute('data-world'));
      document.documentElement.classList.add('world-lock');
    }
  }
  slices.forEach(function (s, i) { s.addEventListener('click', function () { toggle(i); }); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && openIdx >= 0) toggle(openIdx); });
})();
</script>
<script>
(function () {
  // Dreamscape liquid-dimensional seam: vanilla WebGL1 shader
  // displacement over the two artworks, per the 2026-10-26 research
  // report (research_notes/dreamscape-liquid-dimensional-ripple).
  // Progressive enhancement only: the DOM slices stay the tap layer
  // and the fallback. If anything here fails, the page is unchanged.
  var band = document.getElementById('latent-band');
  var canvas = document.getElementById('dream-gl');
  if (!band || !canvas) return;
  var slices = band.querySelectorAll('.slice');
  if (slices.length !== 2) return;

  var gl;
  try {
    gl = canvas.getContext('webgl', { alpha: false, depth: false, stencil: false, antialias: false, powerPreference: 'low-power' });
  } catch (e) { gl = null; }
  if (!gl) return;

  var VERT = 'attribute vec2 aPos;varying vec2 vUv;void main(){vUv=aPos*0.5+0.5;gl_Position=vec4(aPos,0.0,1.0);}';
  var FRAG = [
    'precision mediump float;',
    'varying vec2 vUv;',
    'uniform sampler2D uTexA;',
    'uniform sampler2D uTexB;',
    'uniform float uTime;',
    'uniform float uSplit;',
    'uniform float uHoriz;',
    'uniform float uBand;',
    'uniform float uTA;',
    'uniform float uTB;',
    'uniform float uVA;',
    'vec2 coverUv(vec2 uv, float ta){',
    '  vec2 f = vec2(0.5, 0.68);', // object-position 50% 32%, GL-flipped
    '  float r = uVA / ta;',
    '  vec2 u = uv;',
    '  if (r >= 1.0) { float vf = 1.0 / r; u = vec2(uv.x, f.y * (1.0 - vf) + uv.y * vf); }',
    '  else { u = vec2(f.x * (1.0 - r) + uv.x * r, uv.y); }',
    '  return f + (u - f) / 1.15;', // the 1.15 overscan = drift headroom
    '}',
    'float wave(float s, float t){',
    '  return 0.011 * sin(6.9 * s - t * 0.70)',
    '       + 0.006 * sin(13.7 * s + t * 0.42 + 1.7)',
    '       + 0.0025 * sin(27.0 * s - t * 0.24 + 4.1);',
    '}',
    'float slope(float s, float t){',
    '  return 0.011 * 6.9 * cos(6.9 * s - t * 0.70)',
    '       + 0.006 * 13.7 * cos(13.7 * s + t * 0.42 + 1.7)',
    '       + 0.0025 * 27.0 * cos(27.0 * s - t * 0.24 + 4.1);',
    '}',
    'void main(){',
    '  vec2 uv = vUv;',
    '  float s = mix(uv.y, uv.x, uHoriz);',
    '  float n = mix(uv.x, uv.y, uHoriz);',
    '  float t = uTime;',
    '  float w = wave(s, t);',
    '  float d = n - (uSplit + w);',
    '  float bandF = exp(-abs(d) / uBand);',
    '  float sl = slope(s, t);',
    '  float refr = sl * 0.012 * bandF;',
    '  vec2 refrVec = mix(vec2(refr, 0.0), vec2(0.0, refr), uHoriz);',
    '  float breathe = 1.0 + 0.2 * sin(t * 0.31 + 0.8);',
    '  vec2 driftA = vec2(sin(t * 0.33), sin(t * 0.23 + 1.3)) * 0.020;',
    '  vec2 driftB = vec2(sin(t * 0.19 + 2.1), sin(t * 0.27 + 0.4)) * 0.012;',
    '  vec2 uvA = coverUv(uv, uTA) + driftA + refrVec * breathe;',
    '  vec2 uvB = coverUv(uv, uTB) + driftB + refrVec * 1.6 * breathe;',
    '  vec3 colA = texture2D(uTexA, uvA).rgb;',
    '  vec3 colB = texture2D(uTexB, uvB).rgb;',
    '  float m = smoothstep(-0.0015, 0.0015, d);',
    '  vec3 col = mix(colA, colB, m);',
    '  col += clamp(sl, -1.0, 1.0) * bandF * 0.13;',
    '  col += exp(-abs(d) * 220.0) * 0.08;',
    '  col -= exp(-abs(d - 0.006) * 160.0) * 0.05;',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n');

  function shader(type, src) {
    var sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) return null;
    return sh;
  }
  var vs = shader(gl.VERTEX_SHADER, VERT), fs = shader(gl.FRAGMENT_SHADER, FRAG);
  if (!vs || !fs) return;
  var prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return;
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  var aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  var U = {};
  ['uTexA', 'uTexB', 'uTime', 'uSplit', 'uHoriz', 'uBand', 'uTA', 'uTB', 'uVA'].forEach(function (name) {
    U[name] = gl.getUniformLocation(prog, name);
  });
  gl.uniform1i(U.uTexA, 0);
  gl.uniform1i(U.uTexB, 1);
  gl.uniform1f(U.uBand, 0.055);

  var texA = null, texB = null, ready = false;
  function makeTex(unit, img) {
    var t = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
    // NPOT-safe: the artworks are 1206px wide -- no mipmaps, clamp only.
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    return { tex: t, aspect: img.naturalWidth / img.naturalHeight };
  }
  var loaded = 0;
  function onLoad(which, img) {
    return function () {
      if (which === 0) texA = makeTex(0, img); else texB = makeTex(1, img);
      loaded++;
      if (loaded === 2) start();
    };
  }
  var imgA = new Image(); imgA.onload = onLoad(0, imgA); imgA.src = 'art/golden-city.jpg';
  var imgB = new Image(); imgB.onload = onLoad(1, imgB); imgB.src = 'art/obsidian-dragon.jpg';

  var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  var dprSteps = [2, 1.5, 1.25, 1], stepIdx = 0;
  var inView = true, running = false, raf = 0, lastTs = 0, tSec = 0, splitCur = 0.5;
  var ftSum = 0, ftCount = 0;

  function resize() {
    var w = band.clientWidth, h = band.clientHeight;
    if (!w || !h) return;
    var dpr = Math.min(window.devicePixelRatio || 1, dprSteps[stepIdx]);
    var bw = Math.round(w * dpr), bh = Math.round(h * dpr);
    if (canvas.width !== bw || canvas.height !== bh) {
      canvas.width = bw; canvas.height = bh;
      gl.viewport(0, 0, bw, bh);
    }
    gl.uniform1f(U.uVA, w / h);
  }
  var resizeTimer = 0;
  if (window.ResizeObserver) {
    new ResizeObserver(function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () { stepIdx = 0; resize(); if (mq.matches) drawStatic(); }, 120);
    }).observe(band);
  }
  window.addEventListener('resize', function () { resize(); if (mq.matches) drawStatic(); });

  function layoutSplit() {
    var r = band.getBoundingClientRect();
    if (r.width >= r.height) {
      return { horiz: 0, split: Math.min(1, Math.max(0, (slices[0].offsetWidth - 8) / r.width)) };
    }
    return { horiz: 1, split: Math.min(1, Math.max(0, (slices[0].offsetHeight - 8) / r.height)) };
  }

  function draw(time, split, horiz) {
    if (!texA || !texB) return;
    gl.uniform1f(U.uTime, time);
    gl.uniform1f(U.uSplit, split);
    gl.uniform1f(U.uHoriz, horiz);
    gl.uniform1f(U.uTA, texA.aspect);
    gl.uniform1f(U.uTB, texB.aspect);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  function drawStatic() {
    if (!ready) return;
    resize();
    var lay = layoutSplit();
    draw(0, lay.split, lay.horiz);
  }

  function frame(ts) {
    if (!running) return;
    raf = requestAnimationFrame(frame);
    if (!lastTs) lastTs = ts;
    var dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    tSec += dt;
    var lay = layoutSplit();
    splitCur += (lay.split - splitCur) * (1 - Math.exp(-dt / 0.09));
    draw(tSec, splitCur, lay.horiz);
    // Adaptive quality: sustained slow frames step the DPR cap down.
    ftSum += dt * 1000; ftCount++;
    if (ftCount >= 60) {
      if (ftSum / ftCount > 22 && stepIdx < dprSteps.length - 1) { stepIdx++; resize(); }
      ftSum = 0; ftCount = 0;
    }
  }
  function startLoop() {
    if (running || mq.matches) return;
    running = true; lastTs = 0;
    raf = requestAnimationFrame(frame);
  }
  function stopLoop() {
    running = false;
    if (raf) cancelAnimationFrame(raf);
  }
  function gate() {
    if (!ready) return;
    if (mq.matches) { stopLoop(); drawStatic(); return; }
    if (inView && document.visibilityState === 'visible') startLoop(); else stopLoop();
  }

  if (window.IntersectionObserver) {
    new IntersectionObserver(function (entries) {
      inView = entries[0].isIntersecting;
      gate();
    }, { threshold: 0.02 }).observe(band);
  }
  document.addEventListener('visibilitychange', gate);
  if (mq.addEventListener) mq.addEventListener('change', gate);
  // Reduced-motion path: taps still move the seam, one frame per change.
  new MutationObserver(function () { if (mq.matches) drawStatic(); })
    .observe(band, { attributes: true, attributeFilter: ['class'] });

  canvas.addEventListener('webglcontextlost', function (e) {
    e.preventDefault();
    stopLoop();
    band.classList.remove('gl-live');
    canvas.style.opacity = '0';
  });
  canvas.addEventListener('webglcontextrestored', function () {
    loaded = 0; texA = null; texB = null; ready = false;
    var a2 = new Image(); a2.onload = onLoad(0, a2); a2.src = 'art/golden-city.jpg';
    var b2 = new Image(); b2.onload = onLoad(1, b2); b2.src = 'art/obsidian-dragon.jpg';
  });

  function start() {
    ready = true;
    resize();
    var lay = layoutSplit();
    splitCur = lay.split;
    draw(mq.matches ? 0 : 0.001, lay.split, lay.horiz);
    // First successful frame drawn: reveal the canvas over the DOM.
    band.classList.add('gl-live');
    canvas.style.opacity = '1';
    gate();
  }
})();

</script>
<script>
(function () {
  var btn = document.querySelector('.nav-toggle');
  var nav = document.getElementById('site-nav');
  if (!btn || !nav) return;
  btn.addEventListener('click', function () {
    var open = nav.classList.toggle('open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
})();
</script>

</body>
</html>
